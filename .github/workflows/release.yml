name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build universal app
        env:
          UNIVERSAL: "1"
          VERSION: ${{ needs.release-please.outputs.version }}
        run: ./scripts/build-app.sh
      - name: Package
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent "Git Manager.app" "GitManager-${{ needs.release-please.outputs.tag_name }}-macos.zip"
          hdiutil create -volname "Git Manager" -srcfolder "Git Manager.app" -ov -format UDZO "GitManager-${{ needs.release-please.outputs.tag_name }}.dmg"
          shasum -a 256 GitManager-* > checksums.txt
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" build/GitManager-* build/checksums.txt --clobber
