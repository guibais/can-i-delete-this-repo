name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build & publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: swift test
      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" UNIVERSAL=1 ./scripts/build-app.sh
      - name: Package
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME"
      - name: Release notes
        run: ./scripts/release-notes.sh "$GITHUB_REF_NAME" > build/release/notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && FLAGS+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            build/release/*.dmg build/release/*.zip build/release/checksums.txt \
            --title "Can I Delete This Repo? ${GITHUB_REF_NAME}" \
            --notes-file build/release/notes.md \
            --verify-tag "${FLAGS[@]+"${FLAGS[@]}"}"
