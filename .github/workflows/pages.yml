name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "Support/AppIcon.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Collect assets
        run: |
          mkdir -p site/assets
          cp docs/media/can-i-delete-this-repo.mp4 docs/screenshots/*.png Support/AppIcon.png site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
